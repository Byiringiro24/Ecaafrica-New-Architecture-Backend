# ============================================================
# EcaAfrica — Nginx Configuration
# Server: 169.58.124.150
# Copy to: /etc/nginx/sites-available/ecareafrica
# Enable: ln -s /etc/nginx/sites-available/ecareafrica /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: nginx -s reload
# ============================================================

# ── Frontend — ecareafrica.net ───────────────────────────────
# PM2 serves the Vite dist/ output on port 4173 (pm2 serve)
server {
    listen 80;
    server_name ecareafrica.net www.ecareafrica.net;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API — backend.ecareafrica.net ────────────────────
# PM2 runs the Node/Express backend on port 5500 (ecosystem.config.js)
server {
    listen 80;
    server_name backend.ecareafrica.net;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-polling support (for tablet bridge events)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

