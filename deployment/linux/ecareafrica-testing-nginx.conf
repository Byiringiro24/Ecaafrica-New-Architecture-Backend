# ============================================================
# EcaAfrica — TESTING Nginx Configuration
# Server  : 169.58.124.150
# Frontend: testing.ecareafrica.net       → PM2 port 4174
# Backend : testing-api.ecareafrica.net   → PM2 port 5501
#
# Install:
#   cp ecareafrica-testing-nginx.conf /etc/nginx/sites-available/ecareafrica-testing
#   ln -sf /etc/nginx/sites-available/ecareafrica-testing /etc/nginx/sites-enabled/ecareafrica-testing
#   nginx -t && nginx -s reload
#
# TLS (after DNS is pointed):
#   certbot --nginx -d testing.ecareafrica.net -d testing-api.ecareafrica.net
# ============================================================

# ── Testing Frontend — testing.ecareafrica.net ───────────────
server {
    listen 80;
    server_name testing.ecareafrica.net;

    client_max_body_size 50M;

    # Security headers (testing — relaxed CSP for easier debugging)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Testing Backend API — testing-api.ecareafrica.net ────────
server {
    listen 80;
    server_name testing-api.ecareafrica.net;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / long-polling support (tablet bridge events)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# ── TLS — add after running certbot ─────────────────────────
