openapi: 3.0.3
info:
  title: Education Care Africa — Backend API
  description: |
    Full REST API for the Education Care Africa school management platform.

    ## Authentication
    - **School endpoints** require a JWT issued by `POST /auth/login`
    - **Platform endpoints** require a JWT issued by `POST /auth/platform/login`
    - Send tokens via the `Authorization: Bearer <accessToken>` header

    ## Response Envelope
    All responses follow a consistent envelope:
    ```json
    { "success": true, "data": {}, "meta": { "page": 1, "limit": 20, "total": 1 } }
    ```
    Error responses:
    ```json
    { "success": false, "error": { "code": "bad_request", "message": "Validation failed", "details": [] } }
    ```

    ## Pagination
    Most list endpoints accept: `page`, `limit` (max 100), `sort`, `order` (asc|desc), `q` (search)

    ## File Uploads
    - `POST /students/import` — multipart/form-data, field: `file`
    - `POST /students/:id/photo` — multipart/form-data, field: `photo`
    - `POST /fees/transactions/:id/receipt` — multipart/form-data, field: `receipt`

  version: 1.0.0
  contact:
    name: Education Care Africa Support
    email: support@educationcare.africa
  license:
    name: Proprietary

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.educationcare.africa/api/v1
    description: Production server

tags:
  - name: Docs
    description: API documentation and test tools
  - name: Auth
    description: Authentication — school and platform
  - name: Users
    description: School user management
  - name: Roles
    description: Role and permission management
  - name: Academic Years
    description: Academic year management
  - name: Terms
    description: Term management
  - name: Classes
    description: Class management
  - name: Sections
    description: Section (stream) management
  - name: Subjects
    description: Subject management
  - name: Teacher Assignments
    description: Teacher–section–subject assignments
  - name: Timetable
    description: Timetable periods and slots
  - name: Holidays
    description: Holiday calendar
  - name: Students
    description: Student records, enrollments, parents, photos
  - name: Parents
    description: Parent/guardian profiles
  - name: Biometrics
    description: Biometric enrollment (face, fingerprint, NFC, QR)
  - name: Attendance
    description: Attendance sessions and records
  - name: Gate Logs
    description: Gate entry/exit events
  - name: Boarding
    description: Dormitories, rooms, assignments, roll calls
  - name: Student Leaves
    description: Student leave requests and approvals
  - name: Absence Alerts
    description: Automated absence alerts
  - name: Offline Sync
    description: Offline device record synchronisation
  - name: Fees
    description: Fee structures, assignments, and transactions
  - name: Exams
    description: Exams and results
  - name: Visitors
    description: Visitor management and appointments
  - name: Devices
    description: Registered tablets and kiosk devices
  - name: Staff
    description: Staff profiles and leave balances
  - name: Salary
    description: Salary records and payroll
  - name: Notifications
    description: Notifications, templates, and logs
  - name: Audit Logs
    description: Audit trail for all actions
  - name: System Settings
    description: School-level system settings
  - name: Feature Flags
    description: Platform-level feature flag management
  - name: Platform Schools
    description: Platform admin — school management
  - name: Platform Plans
    description: Platform admin — subscription plan management
  - name: Platform Subscriptions
    description: Platform admin — school subscriptions
  - name: Platform Invoices
    description: Platform admin — billing invoices
  - name: Platform Revenue
    description: Platform admin — revenue reporting
  - name: Platform Users
    description: Platform admin — user management
  - name: Platform Announcements
    description: Platform admin — announcements
  - name: Support Tickets
    description: Platform admin — support ticket management
  - name: SMS Providers
    description: Platform admin — SMS gateway providers

# ─────────────────────────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Reusable responses ───────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid token
      /api/doc/test:
        servers:
          - url: http://localhost:5000
            description: Local development server
          - url: https://api.educationcare.africa
            description: Production server
        get:
          tags: [Docs]
          summary: API tester UI
          description: Serves the API tester HTML page.
          responses:
            '200':

      /api/doc/swagger:
        servers:
          - url: http://localhost:5000
            description: Local development server
          - url: https://api.educationcare.africa
            description: Production server
        get:
          tags: [Docs]
          summary: Swagger/OpenAPI spec
          description: Serves the OpenAPI specification file.
          responses:
            '200':
            $ref: '#/components/schemas/ErrorResponse'

  # ── Reusable parameters ──────────────────────────────────────
  parameters:
    pageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    limitParam:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    sortParam:
      name: sort
      in: query
      schema: { type: string }
    orderParam:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc] }
    qParam:
      name: q
      in: query
      schema: { type: string }
    includeDeletedParam:
      name: include_deleted
      in: query
      schema: { type: boolean }
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  # ── Reusable schemas ─────────────────────────────────────────
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }

    Meta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    # Auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@school.test }
        password: { type: string, example: password123 }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            accessToken: { type: string }
            refreshToken: { type: string }

    # User
    User:
      type: object
      properties:
        id: { type: string }
        uuid: { type: string }
        school_id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [school_admin, teacher, staff, parent, student]
        status:
          type: string
          enum: [active, inactive, locked, pending]
        avatar_url: { type: string, nullable: true }

    # Role
    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        permissions:
          type: array
          items: { type: string }
        is_system: { type: boolean }

    # Academic Year
    AcademicYear:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: 2025/2026 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_current: { type: boolean }

    # Term
    Term:
      type: object
      properties:
        id: { type: string }
        academic_year_id: { type: string }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_current: { type: boolean }

    # Class
    Class:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: integer }
        description: { type: string }
        academic_year_id: { type: string }

    # Section
    Section:
      type: object
      properties:
        id: { type: string }
        class_id: { type: string }
        name: { type: string }
        full_name: { type: string }
        class_teacher_id: { type: string, nullable: true }
        capacity: { type: integer }
        room: { type: string }

    # Subject
    Subject:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        description: { type: string }

    # Student
    Student:
      type: object
      properties:
        id: { type: string }
        student_id_number: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        other_names: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        national_id: { type: string }
        nationality: { type: string }
        student_type: { type: string, enum: [boarding, day] }
        status: { type: string, enum: [active, inactive, transferred, graduated, expelled] }
        photo_url: { type: string, nullable: true }
        address: { type: string }
        admission_date: { type: string, format: date }
        enrollment_year: { type: integer }

    # Parent
    Parent:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        email: { type: string }
        relationship: { type: string }
        address: { type: string }
        occupation: { type: string }

    # Exam
    Exam:
      type: object
      properties:
        id: { type: string }
        section_id: { type: string }
        subject_id: { type: string }
        teacher_id: { type: string }
        term_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [cat, main_exam, mock, quiz, assignment] }
        exam_date: { type: string, format: date }
        start_time: { type: string }
        duration_min: { type: integer }
        max_marks: { type: number }
        pass_mark: { type: number }
        status: { type: string, enum: [scheduled, ongoing, completed, cancelled] }

    # Fee Structure
    FeeStructure:
      type: object
      properties:
        id: { type: string }
        academic_year_id: { type: string }
        term_id: { type: string }
        class_id: { type: string }
        name: { type: string }
        amount: { type: number }
        currency: { type: string, example: RWF }
        is_mandatory: { type: boolean }
        due_date: { type: string, format: date }

    # Platform School
    PlatformSchool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        school_type: { type: string, enum: [government, private, international, technical, seminary, other] }
        province: { type: string }
        district: { type: string }
        status: { type: string, enum: [active, trial, grace, suspended, expired, cancelled] }
        timezone: { type: string }
        currency: { type: string }
        has_boarding: { type: boolean }
        has_biometrics: { type: boolean }
        has_gate: { type: boolean }
        has_visitor_mgmt: { type: boolean }
        has_exam_system: { type: boolean }
        has_salary_mgmt: { type: boolean }
        has_parent_app: { type: boolean }
        has_bulk_sms: { type: boolean }

# ─────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════════
  # DOCS
  # ══════════════════════════════════════════════════════════════
  /doc/test:
    get:
      tags: [Docs]
      summary: API tester UI
      description: Serves the API tester HTML page.
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /doc/swagger:
    get:
      tags: [Docs]
      summary: Swagger/OpenAPI spec
      description: Serves the OpenAPI specification file.
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object

  # ══════════════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: School login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/platform/login:
    post:
      tags: [Auth]
      summary: Platform admin login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Platform login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (school or platform)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                refreshToken: { type: string }
      responses:
        '200':
          description: Logged out

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens issued

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset link sent (if account exists)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword, confirmPassword]
              properties:
                token: { type: string }
                newPassword: { type: string }
                confirmPassword: { type: string }
      responses:
        '200':
          description: Password reset successful

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current user profile

  # ══════════════════════════════════════════════════════════════
  # USERS
  # ══════════════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: List school users
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/limitParam' }
        - { $ref: '#/components/parameters/qParam' }
        - name: role
          in: query
          schema: { type: string, enum: [school_admin, teacher, staff, parent, student] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, locked, pending] }
        - { $ref: '#/components/parameters/includeDeletedParam' }
      responses:
        '200': { description: List of users }
    post:
      tags: [Users]
      summary: Create school user
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                role: { type: string, enum: [school_admin, teacher, staff, parent, student] }
                status: { type: string, enum: [active, inactive, locked, pending] }
                password: { type: string }
                avatar_url: { type: string, nullable: true }
      responses:
        '201': { description: User created }

  /users/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [Users]
      summary: Get user by ID
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: User object }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update user
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                role: { type: string }
                status: { type: string }
                avatar_url: { type: string, nullable: true }
                password: { type: string }
      responses:
        '200': { description: Updated user }
    delete:
      tags: [Users]
      summary: Delete user
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted user }

  /users/{id}/roles:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [Users]
      summary: Assign role to user
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string }
      responses:
        '200': { description: Updated user with roles }

  /users/{id}/roles/{roleId}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
      - name: roleId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Users]
      summary: Remove role from user
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Updated user with roles }

  # ══════════════════════════════════════════════════════════════
  # ROLES
  # ══════════════════════════════════════════════════════════════
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/limitParam' }
        - { $ref: '#/components/parameters/qParam' }
        - { $ref: '#/components/parameters/includeDeletedParam' }
      responses:
        '200': { description: List of roles }
    post:
      tags: [Roles]
      summary: Create role
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                permissions: { type: array, items: { type: string } }
                is_system: { type: boolean }
      responses:
        '201': { description: Role created }

  /roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [Roles]
      summary: Get role
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Role object }
    patch:
      tags: [Roles]
      summary: Update role
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        '200': { description: Updated role }
    delete:
      tags: [Roles]
      summary: Delete role
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted role }

  # ══════════════════════════════════════════════════════════════
  # ACADEMIC YEARS
  # ══════════════════════════════════════════════════════════════
  /academic-years:
    get:
      tags: [Academic Years]
      summary: List academic years
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/limitParam' }
        - { $ref: '#/components/parameters/includeDeletedParam' }
      responses:
        '200': { description: List of academic years }
    post:
      tags: [Academic Years]
      summary: Create academic year
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcademicYear' }
      responses:
        '201': { description: Academic year created }

  /academic-years/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [Academic Years]
      summary: Get academic year
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Academic year }
    patch:
      tags: [Academic Years]
      summary: Update academic year
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcademicYear' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Academic Years]
      summary: Delete academic year
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  # ══════════════════════════════════════════════════════════════
  # TERMS
  # ══════════════════════════════════════════════════════════════
  /terms:
    get:
      tags: [Terms]
      summary: List terms
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/limitParam' }
        - name: academic_year_id
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/includeDeletedParam' }
      responses:
        '200': { description: List of terms }
    post:
      tags: [Terms]
      summary: Create term
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Term' }
      responses:
        '201': { description: Term created }

  /terms/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [Terms]
      summary: Get term
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Term }
    patch:
      tags: [Terms]
      summary: Update term
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Term' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Terms]
      summary: Delete term
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  # ══════════════════════════════════════════════════════════════
  # CLASSES
  # ══════════════════════════════════════════════════════════════
  /classes:
    get:
      tags: [Classes]
      summary: List classes
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/limitParam' }
        - { $ref: '#/components/parameters/qParam' }
        - name: academic_year_id
          in: query
          schema: { type: string }
      responses:
        '200': { description: List of classes }
    post:
      tags: [Classes]
      summary: Create class
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Class' }
      responses:
        '201': { description: Class created }

  /classes/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [Classes]
      summary: Get class
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Class }
    patch:
      tags: [Classes]
      summary: Update class
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Class' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Classes]
      summary: Delete class
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  # ══════════════════════════════════════════════════════════════
  # SECTIONS
  # ══════════════════════════════════════════════════════════════
  /sections:
